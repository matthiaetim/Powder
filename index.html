<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Powder – Ski Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Minimalistischer Ski-Simulator: fahr der Lawine davon.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Powder">
  <meta name="theme-color" content="#F5F9FD">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <!-- Schriften und alle Module vorab laden: sonst entdeckt der Browser die Imports erst beim Parsen von main.js und
       holt sie in drei Stufen nacheinander; die Schrift käme nach dem ersten Bild und der Text spränge um -->
  <link rel="preload" href="./fonts/LuckiestGuy-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/Nunito-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="./src/main.js">
  <link rel="modulepreload" href="./src/constants.js">
  <link rel="modulepreload" href="./src/game.js">
  <link rel="modulepreload" href="./src/input.js">
  <link rel="modulepreload" href="./src/render.js">
  <link rel="modulepreload" href="./src/hud.js">
  <link rel="modulepreload" href="./src/tune.js">
  <link rel="modulepreload" href="./src/audio.js">
  <link rel="modulepreload" href="./src/i18n.js">
  <link rel="modulepreload" href="./src/settings.js">
  <link rel="modulepreload" href="./src/net.js">
  <link rel="modulepreload" href="./src/auth.js">
  <link rel="modulepreload" href="./src/board.js">
  <link rel="modulepreload" href="./src/room.js">
  <link rel="modulepreload" href="./src/duel.js">
  <link rel="modulepreload" href="./src/bot.js">
  <link rel="modulepreload" href="./src/bot-room.js">
  <link rel="modulepreload" href="./src/duel-card.js">
  <link rel="modulepreload" href="./src/physics.js">
  <link rel="modulepreload" href="./src/world.js">
  <link rel="modulepreload" href="./src/avalanche.js">
  <link rel="modulepreload" href="./src/avalanche-view.js">
  <link rel="modulepreload" href="./src/collision.js">
  <link rel="modulepreload" href="./src/track.js">
  <link rel="modulepreload" href="./src/particles.js">
  <link rel="modulepreload" href="./src/storage.js">
  <link rel="modulepreload" href="./src/modes.js">
  <link rel="modulepreload" href="./src/riders.js">
  <link rel="modulepreload" href="./src/gates.js">
  <link rel="modulepreload" href="./src/gate-marks.js">
  <link rel="modulepreload" href="./src/guide-line.js">
  <link rel="modulepreload" href="./src/fence.js">
  <link rel="modulepreload" href="./src/fence-view.js">
  <link rel="modulepreload" href="./src/start-house.js">
  <link rel="modulepreload" href="./src/stadium.js">
  <link rel="modulepreload" href="./src/stadium-view.js">
  <link rel="modulepreload" href="./src/snow-scrub.js">
  <link rel="modulepreload" href="./src/yeti.js">
</head>
<body data-state="ready" data-overlay="" data-intro="1">
  <canvas id="game"></canvas>
  <div id="hud" aria-live="off">
    <div id="hud-speed">0 km/h</div>
    <div id="hud-dist">0 m</div>
    <div id="hud-time">0,00</div>
    <div id="hud-opp"></div>
  </div>
  <div id="hud-note"></div>
  <div id="hint" data-t="hint">Tippen lenkt · Halten carvt</div>
  <div id="ov-count" class="overlay"></div>
  <div id="ov-pause" class="overlay">
    <div class="ov-title" data-t="pause">Pause</div>
    <div class="ov-sub">Tippen zum Weiterfahren</div>
  </div>
  <div id="ov-dead" class="overlay">
   <button id="btn-rider" type="button" aria-label="Fahrer wählen" data-t-aria="aria.rider"><canvas class="rider-preview" width="40" height="40"></canvas></button>
   <button id="btn-sound" type="button" aria-label="Ton an" aria-pressed="true">
    <svg class="sound-icon" viewBox="0 0 40 40" aria-hidden="true">
     <path class="spk" d="M8 16h6l8-7v22l-8-7H8z"/>
     <path class="wave" d="M26.5 15.5a6.5 6.5 0 0 1 0 9"/>
     <path class="wave" d="M30 11.5a12 12 0 0 1 0 17"/>
     <path class="mute" d="M27 16l8 8M35 16l-8 8"/>
    </svg>
   </button>
   <!-- Einstellungen: Zahnrad links neben dem Ton-Icon, öffnet die Kachel „Einstellungen“ (settings.js) -->
   <button id="btn-settings" type="button" aria-label="Einstellungen" data-t-aria="aria.settings">
    <svg class="gear-icon" viewBox="0 0 40 40" aria-hidden="true">
     <path class="gear" fill-rule="evenodd" d="M17.17 9.79L17.66 5.99L22.34 5.99L22.83 9.79A10.6 10.6 0 0 1 25.22 10.77L28.25 8.44L31.56 11.75L29.23 14.78A10.6 10.6 0 0 1 30.21 17.17L34.01 17.66L34.01 22.34L30.21 22.83A10.6 10.6 0 0 1 29.23 25.22L31.56 28.25L28.25 31.56L25.22 29.23A10.6 10.6 0 0 1 22.83 30.21L22.34 34.01L17.66 34.01L17.17 30.21A10.6 10.6 0 0 1 14.78 29.23L11.75 31.56L8.44 28.25L10.77 25.22A10.6 10.6 0 0 1 9.79 22.83L5.99 22.34L5.99 17.66L9.79 17.17A10.6 10.6 0 0 1 10.77 14.78L8.44 11.75L11.75 8.44L14.78 10.77A10.6 10.6 0 0 1 17.17 9.79ZM24.6 20A4.6 4.6 0 1 0 15.4 20A4.6 4.6 0 1 0 24.6 20Z"/>
    </svg>
   </button>
   <div id="settings-card" class="card">
    <div class="card-title" data-t="settings.title">Einstellungen</div>
    <div id="settings-body">
     <button id="set-stats" class="set-check" type="button" role="checkbox" aria-checked="false">
      <span class="set-box" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.8 3.8 7.2-8.6"/></svg></span>
      <span class="set-check-text">
       <span class="set-check-title" data-t="settings.stats">Anonyme Spielstatistik senden</span>
       <span class="set-check-sub" data-t="settings.statsSub"></span>
      </span>
     </button>
     <div class="set-head" data-t="settings.lang">Sprache</div>
     <div id="set-langs"></div>
     <div id="set-board">
      <div class="set-head" data-t="settings.name">Name</div>
      <input id="set-name" class="field native" type="text" maxlength="12" placeholder="Dein Name" autocomplete="off" autocorrect="off"
             autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Dein Name" data-t-ph="name.ph" data-t-aria="name.ph">
      <div id="set-name-note" class="set-note"></div>
      <button id="set-marks" class="set-check" type="button" role="checkbox" aria-checked="true">
       <span class="set-box" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.8 3.8 7.2-8.6"/></svg></span>
       <span class="set-check-text">
        <span class="set-check-title" data-t="settings.marks">Namenslinien im Schnee</span>
        <span class="set-check-sub" data-t="settings.marksSub"></span>
       </span>
      </button>
     </div>
     <div class="set-head-row">
      <span class="set-head" data-t="settings.sound">Ton</span>
      <button id="set-snd-reset" class="btn-flat" type="button" data-t="settings.soundReset">Standard</button>
     </div>
     <div id="set-sounds"></div>
    </div>
    <button id="btn-settings-back" class="btn-flat" type="button" data-t="back">Zurück</button>
   </div>
   <div id="rider-card" class="card">
    <div class="card-title" data-t="rider.title">Fahrer</div>
    <div id="riders"></div>
    <button id="btn-rider-back" class="btn-flat" type="button" data-t="back">Zurück</button>
   </div>
   <div id="stats-card" class="card">
    <div class="card-title" data-t="stats.title">Bestenliste</div>
    <div id="stats-mode"></div>
    <div id="stats-head" class="stats-row"></div>
    <div id="stats-list"></div>
    <div id="stats-note"></div>
    <button id="btn-stats-back" class="btn-flat" type="button" data-t="back">Zurück</button>
   </div>
   <div id="modes-card" class="card">
    <div class="card-title" data-t="modes.title">Modus</div>
    <div id="modes-list"></div>
    <button id="btn-modes-back" class="btn-flat" type="button" data-t="back">Zurück</button>
   </div>
   <div id="duel-card" class="card" data-view="join">
    <div class="card-title" data-t="duel.title">Duell</div>
    <div id="duel-note"></div>
    <div id="duel-name-row" class="duel-field-row">
      <input id="duel-name" class="field native" type="text" maxlength="12" placeholder="Dein Name" autocomplete="off" autocorrect="off"
             autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Dein Name" data-t-ph="name.ph" data-t-aria="name.ph">
    </div>
    <button id="btn-duel-create" class="btn-main" type="button" data-t="duel.create">Neuer Raum</button>
    <div id="duel-code-row" class="duel-code-row"><span id="duel-code" class="duel-code"></span><button id="btn-duel-share" class="btn-flat native" type="button" data-t="duel.share">Teilen</button></div>
    <div id="duel-bibs" class="duel-bibs"></div>
    <div id="duel-levels" class="duel-levels" role="group" aria-label="Stufe des Bots" data-t-aria="duel.levels"></div>
    <div id="duel-target" class="duel-sign">
      <div class="duel-sign-row"><span class="duel-sign-label" data-t="duel.target">Ziel</span><span id="duel-target-val" class="duel-sign-val">1.000 m</span></div>
      <input id="duel-target-range" class="native" type="range" min="1000" max="10000" step="500" value="1000" aria-label="Zielweite" data-t-aria="duel.targetAria">
    </div>
    <button id="btn-duel-go" class="btn-main" type="button">Los</button>
    <div id="duel-verdict"></div>
    <div id="duel-lines"></div>
    <button id="btn-duel-again" class="btn-main" type="button">Revanche</button>
    <div id="duel-join-row" class="duel-join-row">
      <input id="duel-code-in" class="field native" type="text" maxlength="4" placeholder="Code" autocomplete="off" autocorrect="off"
             autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Raum-Code" data-t-ph="duel.code" data-t-aria="duel.codeAria">
      <button id="btn-duel-join" class="btn-flat" type="button" data-t="duel.join">Beitreten</button>
    </div>
    <button id="btn-duel-bot" class="btn-flat" type="button" data-t="duel.bot">Gegen Bot</button>
    <button id="btn-duel-human" class="btn-flat" type="button" data-t="duel.human">Gegen Mitspieler</button>
    <div id="duel-error"></div>
    <button id="btn-duel-leave" class="btn-flat" type="button" data-t="back">Zurück</button>
   </div>
   <div id="dead-card" class="card">
    <div id="dead-dist">0 m</div>
    <div id="dead-time">in 0,00 Sekunden</div>
    <div id="dead-best">Bester Lauf 0 m</div>
    <div id="board" hidden>
      <div id="board-rows"></div>
      <div id="board-more" hidden>…</div>
      <label class="board-row board-own" for="board-name">
        <span class="board-rank"></span>
        <input id="board-name" type="text" maxlength="12" placeholder="Dein Name" autocomplete="off" autocorrect="off"
               autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Dein Name für die Bestenliste" data-t-ph="name.ph" data-t-aria="name.aria">
        <span class="board-m"></span>
      </label>
      <div id="board-note"></div>
    </div>
    <button id="btn-fresh" type="button">Fresh</button>
    <div id="modes"></div>
    <button id="btn-modes" class="btn-flat" type="button" data-t="modes.choose">Modus auswählen</button>
   </div>
  </div>
  <!-- Neustart (Super-G, Slalom, Duell gegen den Bot): nach den Overlays, damit er auch über der Pause liegt -->
  <button id="btn-restart" type="button" aria-label="Neustart" data-t-aria="aria.restart">
   <svg class="restart-icon" viewBox="0 0 40 40" aria-hidden="true">
    <path d="M29.2 14.2A11 11 0 1 0 31 22.5"/>
    <path d="M30.5 7.5l-1 7.3-7.3-1"/>
   </svg>
  </button>
  <div id="version" role="button" aria-label="Version, lange drücken für Tuning" data-t-aria="aria.version"></div>
  <div id="tune" hidden></div>
  <pre id="debug" hidden></pre>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
