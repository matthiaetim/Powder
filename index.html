<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Powder – Ski Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Minimalistischer Ski-Simulator: fahr der Lawine davon.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Powder">
  <meta name="theme-color" content="#F5F9FD">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <!-- Schriften und alle Module vorab laden: sonst entdeckt der Browser die Imports erst beim Parsen von main.js und
       holt sie in drei Stufen nacheinander; die Schrift käme nach dem ersten Bild und der Text spränge um -->
  <link rel="preload" href="./fonts/LuckiestGuy-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/Nunito-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="./src/main.js">
  <link rel="modulepreload" href="./src/constants.js">
  <link rel="modulepreload" href="./src/game.js">
  <link rel="modulepreload" href="./src/input.js">
  <link rel="modulepreload" href="./src/render.js">
  <link rel="modulepreload" href="./src/hud.js">
  <link rel="modulepreload" href="./src/tune.js">
  <link rel="modulepreload" href="./src/audio.js">
  <link rel="modulepreload" href="./src/net.js">
  <link rel="modulepreload" href="./src/board.js">
  <link rel="modulepreload" href="./src/room.js">
  <link rel="modulepreload" href="./src/duel.js">
  <link rel="modulepreload" href="./src/duel-card.js">
  <link rel="modulepreload" href="./src/physics.js">
  <link rel="modulepreload" href="./src/world.js">
  <link rel="modulepreload" href="./src/avalanche.js">
  <link rel="modulepreload" href="./src/avalanche-view.js">
  <link rel="modulepreload" href="./src/collision.js">
  <link rel="modulepreload" href="./src/track.js">
  <link rel="modulepreload" href="./src/particles.js">
  <link rel="modulepreload" href="./src/storage.js">
  <link rel="modulepreload" href="./src/modes.js">
  <link rel="modulepreload" href="./src/riders.js">
  <link rel="modulepreload" href="./src/gates.js">
  <link rel="modulepreload" href="./src/yeti.js">
</head>
<body data-state="ready" data-overlay="" data-intro="1">
  <canvas id="game"></canvas>
  <div id="hud" aria-live="off">
    <div id="hud-speed">0 km/h</div>
    <div id="hud-dist">0 m</div>
    <div id="hud-time">0,00</div>
    <div id="hud-opp"></div>
  </div>
  <div id="hud-note"></div>
  <div id="hint">Tippen lenkt · Halten carvt</div>
  <div id="ov-count" class="overlay"></div>
  <div id="ov-pause" class="overlay">
    <div class="ov-title">Pause</div>
    <div class="ov-sub">Tippen zum Weiterfahren</div>
  </div>
  <div id="ov-dead" class="overlay">
   <button id="btn-rider" type="button" aria-label="Fahrer wählen"><canvas class="rider-preview" width="40" height="40"></canvas></button>
   <div id="rider-card" class="card">
    <div class="card-title">Fahrer</div>
    <div id="riders"></div>
    <button id="btn-rider-back" class="btn-flat" type="button">Zurück</button>
   </div>
   <div id="stats-card" class="card">
    <div class="card-title">Bestenliste</div>
    <div id="stats-mode"></div>
    <div id="stats-head" class="stats-row"></div>
    <div id="stats-list"></div>
    <div id="stats-note"></div>
    <button id="btn-stats-back" class="btn-flat" type="button">Zurück</button>
   </div>
   <div id="modes-card" class="card">
    <div class="card-title">Modus</div>
    <div id="modes-list"></div>
    <button id="btn-modes-back" class="btn-flat" type="button">Zurück</button>
   </div>
   <div id="duel-card" class="card" data-view="join">
    <div class="card-title">Duell</div>
    <div id="duel-note"></div>
    <div id="duel-name-row" class="duel-field-row">
      <input id="duel-name" class="field native" type="text" maxlength="12" placeholder="Dein Name" autocomplete="off" autocorrect="off"
             autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Dein Name">
    </div>
    <button id="btn-duel-create" class="btn-main" type="button">Neuer Raum</button>
    <div id="duel-code-row" class="duel-code-row"><span id="duel-code" class="duel-code"></span><button id="btn-duel-share" class="btn-flat native" type="button">Teilen</button></div>
    <div id="duel-bibs" class="duel-bibs"></div>
    <div id="duel-target" class="duel-sign">
      <div class="duel-sign-row"><span class="duel-sign-label">Ziel</span><span id="duel-target-val" class="duel-sign-val">1.000 m</span></div>
      <input id="duel-target-range" class="native" type="range" min="1000" max="10000" step="500" value="1000" aria-label="Zielweite">
    </div>
    <button id="btn-duel-go" class="btn-main" type="button">Los</button>
    <div id="duel-verdict"></div>
    <div id="duel-lines"></div>
    <button id="btn-duel-again" class="btn-main" type="button">Revanche</button>
    <div id="duel-join-row" class="duel-join-row">
      <input id="duel-code-in" class="field native" type="text" maxlength="4" placeholder="Code" autocomplete="off" autocorrect="off"
             autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Raum-Code">
      <button id="btn-duel-join" class="btn-flat" type="button">Beitreten</button>
    </div>
    <div id="duel-error"></div>
    <button id="btn-duel-leave" class="btn-flat" type="button">Verlassen</button>
   </div>
   <div id="dead-card" class="card">
    <div id="dead-dist">0 m</div>
    <div id="dead-time">in 0,00 Sekunden</div>
    <div id="dead-best">Bester Lauf 0 m</div>
    <div id="board" hidden>
      <div id="board-rows"></div>
      <div id="board-more" hidden>…</div>
      <label class="board-row board-own" for="board-name">
        <span class="board-rank"></span>
        <input id="board-name" type="text" maxlength="12" placeholder="Dein Name" autocomplete="off" autocorrect="off"
               autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Dein Name für die Bestenliste">
        <span class="board-m"></span>
      </label>
      <div id="board-note"></div>
    </div>
    <button id="btn-fresh" type="button">Fresh</button>
    <button id="mode-current" class="mode-card mode-row" type="button" aria-label="Modus wählen">
      <canvas class="mode-preview" width="104" height="58"></canvas>
      <span class="mode-text"><span class="mode-name"></span><span class="mode-desc"></span></span>
      <span class="mode-more">ändern</span>
    </button>
    <button id="btn-sound" type="button">Ton an</button>
   </div>
  </div>
  <div id="version" role="button" aria-label="Version, lange drücken für Tuning"></div>
  <div id="tune" hidden><div class="tune-title">Tuning</div></div>
  <pre id="debug" hidden></pre>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
